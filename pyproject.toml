[project]
name = "travelplanner"
version = "0.1.0"
description = "A memory-aware, MCP-powered single-agent travel day planner"
requires-python = ">=3.11"
dependencies = [
  "cryptography==44.0.3",
  "httpx>=0.27,<1",
  "langsmith>=0.4.30,<1",
  "mcp>=1.12,<2",
  "mem0ai>=0.1.118,<1",
  "openai>=1.99,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "streamlit>=1.49,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
